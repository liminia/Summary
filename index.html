<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خلاصه‌ساز آفلاین چت (هوشمند)</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-app: #f2f4f7;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --bg-input-focus: #ffffff;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #334155;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #15803d;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #b91c1c;
      --danger-hover: #fee2e2;
      --font-ui: 'Vazirmatn', Tahoma, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100dvh; }

    body {
      font-family: var(--font-ui);
      color: var(--text-main);
      background-color: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.03), 0 10px 20px -4px rgba(0,0,0,.04);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-top {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px 0;
    }
    h1 { margin: 0; font-size: 17px; font-weight: 800; color: #1e293b; }
    .subtitle { margin: 0; font-size: 12.5px; color: var(--text-muted); }

    .guide-text {
      margin: 10px 0 0;
      font-size: 13px; line-height: 1.7; color: var(--text-muted);
      background: var(--bg-input); padding: 12px 16px;
      border-radius: 10px; border-right: 3px solid var(--accent);
    }
    kbd {
      font-family: var(--font-ui); font-size: 11.5px; background: #fff;
      border: 1px solid var(--border-subtle); border-bottom-width: 2px;
      color: var(--text-main); padding: 2px 6px; border-radius: 6px; font-weight: 600;
    }

    .section-group { display: flex; flex-direction: column; gap: 10px; }
    .input-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .input-actions { display: inline-flex; align-items: center; gap: 8px; }
    .field-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--text-main); }
    .label-hint { font-size: 11.5px; font-weight: 500; color: var(--text-muted); }

    button { font-family: inherit; cursor: pointer; border: none; outline: none; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }

    .btn-paste {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 8px; font-size: 12.5px; font-weight: 600;
      color: var(--accent); background: var(--accent-soft);
    }
    .btn-paste:hover { background: rgba(37,99,235,.15); }

    .btn-clear {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 8px; font-size: 12.5px; font-weight: 600;
      color: var(--text-muted); background: var(--bg-input); border: 1px solid var(--border-subtle);
    }
    .btn-clear:hover:not(:disabled) { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
    .btn-clear:disabled { opacity: .4; cursor: not-allowed; }

    textarea {
      width: 100%; height: 180px; resize: none; background: var(--bg-input);
      color: var(--text-main); border: 1px solid var(--border-subtle); border-radius: 12px;
      padding: 14px; font-family: inherit; font-size: 13.5px; line-height: 1.8;
      transition: border-color .2s ease, background .2s ease;
    }
    textarea::placeholder { color: #94a3b8; }
    textarea:hover { border-color: var(--border-strong); }
    textarea:focus { border-color: var(--accent); background: var(--bg-input-focus); box-shadow: 0 0 0 3px var(--accent-soft); }

    .segmented {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 4px; border-radius: 10px; background: var(--bg-input); border: 1px solid var(--border-subtle);
    }
    .ratio-btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 8px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
      color: var(--text-muted); background: transparent; border: 1px solid transparent;
    }
    .ratio-btn:hover { color: var(--text-main); background: rgba(255,255,255,.6); }
    .ratio-btn.active { color: var(--accent); background: #fff; border-color: var(--border-subtle); box-shadow: 0 1px 3px rgba(0,0,0,.05); }

    .btn-primary {
      width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px; border-radius: 10px; background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--border-strong); cursor: not-allowed; }

    .stage { display: flex; flex-direction: column; gap: 16px; }
    .stage.hidden { display: none; }

    .alert { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; }
    .alert.show { display: flex; }
    .alert-error { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text); }

    .output-topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .btn-back {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: 8px; font-size: 12.5px; font-weight: 600; flex-shrink: 0;
      color: var(--danger-text); background: var(--danger-bg); border: 1px solid var(--danger-border);
    }
    .btn-back:hover { background: var(--danger-hover); border-color: #fca5a5; }
    .btn-back svg { transform: rotate(180deg); }

    .stats-chip {
      display: none; align-items: center; gap: 6px; flex: 1; min-width: 0;
      padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
      background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success-text);
    }
    .stats-chip.show { display: flex; }
    .stats-chip svg { flex-shrink: 0; }

    .output-container {
      height: 180px; max-height: 180px; overflow-y: auto;
      background: var(--bg-input); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 14px;
      transition: height .25s ease, max-height .25s ease;
    }
    .output-container.expanded { height: 350px; max-height: 350px; }
    .output-container::-webkit-scrollbar { width: 6px; }
    .output-container::-webkit-scrollbar-track { background: transparent; }
    .output-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .output-text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.85; color: var(--text-main); margin: 0; font-family: 'Vazirmatn', monospace; }

    .output-label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .btn-expand {
      background: transparent; color: var(--accent);
      font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-expand:hover { background: var(--accent-soft); }

    .btn-copy {
      width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #fff; background: var(--accent);
    }
    .btn-copy:hover { background: var(--accent-hover); }

    @media (max-width: 540px) {
      body { padding: 12px; }
      .card { padding: 20px; }
      .segmented { grid-template-columns: 1fr; }
      .stats-chip { flex-basis: 100%; }
      .header-top { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>

  <main class="card">
    <header>
      <div class="header-top">
        <h1>خلاصه‌ساز آفلاین چت (هوشمند)</h1>
        <p class="subtitle">پردازش محلی، با درک کد و حذف افزونگی</p>
      </div>

      <p id="guideText" class="guide-text">
        در صفحه چت <kbd>Ctrl+A</kbd> و <kbd>Ctrl+C</kbd> را بزنید و متن را اینجا پیست کنید.
      </p>
    </header>

    <div id="errorAlert" class="alert alert-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <span id="errorText"></span>
    </div>

    <!-- مرحله ۱: ورودی -->
    <div id="stageInput" class="stage">
      <div class="input-header">
        <label for="inputText" class="field-label">متن خام گفتگو</label>
        <div class="input-actions">
          <button id="btnPaste" type="button" class="btn-paste" onclick="handlePasteClick()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
            <span id="pasteLabel">پیست</span>
          </button>
          <button id="btnClear" type="button" class="btn-clear" disabled onclick="clearInput()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            پاک‌سازی
          </button>
        </div>
      </div>

      <textarea id="inputText" oninput="syncClearButton()" placeholder="متن چت را اینجا قرار دهید (Paste)..."></textarea>

      <div class="section-group">
        <span class="field-label">میزان فشرده‌سازی</span>
        <div class="segmented" role="radiogroup" id="ratioGroup1">
          <button type="button" role="radio" aria-checked="false" data-ratio="0.25" class="ratio-btn" onclick="selectRatio(this)">زیاد</button>
          <button type="button" role="radio" aria-checked="true" data-ratio="0.40" class="ratio-btn active" onclick="selectRatio(this)">متعادل</button>
          <button type="button" role="radio" aria-checked="false" data-ratio="0.60" class="ratio-btn" onclick="selectRatio(this)">کم</button>
        </div>
      </div>

      <button id="btnGenerate" type="button" class="btn-primary" onclick="generateSummary()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h6"/></svg>
        تولید خلاصه ساختاریافته
      </button>
    </div>

    <!-- مرحله ۲: خروجی -->
    <div id="stageOutput" class="stage hidden">

      <div class="output-topbar">
        <button type="button" class="btn-back" onclick="goBack()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          بازگشت و ویرایش متن
        </button>

        <div id="statsAlert" class="stats-chip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          <span id="statsText"></span>
        </div>
      </div>

      <div class="section-group">
        <span class="field-label">
          میزان فشرده‌سازی
          <span class="label-hint">— با تغییر، خودکار اعمال می‌شود</span>
        </span>
        <div class="segmented" role="radiogroup" id="ratioGroup2">
          <button type="button" role="radio" aria-checked="false" data-ratio="0.25" class="ratio-btn" onclick="selectRatio(this)">زیاد</button>
          <button type="button" role="radio" aria-checked="true" data-ratio="0.40" class="ratio-btn active" onclick="selectRatio(this)">متعادل</button>
          <button type="button" role="radio" aria-checked="false" data-ratio="0.60" class="ratio-btn" onclick="selectRatio(this)">کم</button>
        </div>
      </div>

      <div class="section-group">
        <div class="output-label-row">
          <span class="field-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
            خروجی آماده انتقال
          </span>

          <button type="button" class="btn-expand" id="btnExpand" onclick="toggleOutputHeight()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            <span id="expandLabel">مشاهده بیشتر</span>
          </button>
        </div>

        <div class="output-container" id="outputContainer">
          <p id="outputText" class="output-text"></p>
        </div>
      </div>

      <button id="btnCopy" type="button" class="btn-copy" onclick="copyResult()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span id="copyLabel">کپی نتیجه</span>
      </button>
    </div>

  </main>

  <script>
    let currentRatio = 0.40;
    let fullSummaryPrompt = '';
    let isExpanded = false;

    const CHEVRON_DOWN = '<path d="m6 9 6 6 6-6"/>';
    const CHEVRON_UP = '<path d="m18 15-6-6-6 6"/>';

    function normalizePersian(text) {
      return text
        .replace(/ي/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getSimilarity(str1, str2) {
      const set1 = new Set(str1.split(/\s+/));
      const set2 = new Set(str2.split(/\s+/));
      const intersection = new Set([...set1].filter(x => set2.has(x)));
      const union = new Set([...set1, ...set2]);
      return intersection.size / union.size;
    }

    function syncClearButton() {
      const hasText = document.getElementById('inputText').value.trim().length > 0;
      document.getElementById('btnClear').disabled = !hasText;
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
      syncClearButton();
      document.getElementById('errorAlert').classList.remove('show');
    }

    async function handlePasteClick() {
      const inputEl = document.getElementById('inputText');
      const pasteLabel = document.getElementById('pasteLabel');
      document.getElementById('errorAlert').classList.remove('show');

      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          const clipText = await navigator.clipboard.readText();
          if (clipText) {
            inputEl.value = clipText;
            syncClearButton();
            pasteLabel.innerText = 'پیست شد';
            setTimeout(() => { pasteLabel.innerText = 'پیست'; }, 1500);
            return;
          }
        }
      } catch (err) { /* دسترسی محدود است */ }

      inputEl.focus();
      try { document.execCommand('paste'); } catch (e) {}
      syncClearButton();
      if (!inputEl.value.trim()) {
        showError('دسترسی به کلیپ‌بورد محدود است. لطفاً دستی (Ctrl+V) پیست کنید.');
      }
    }

    function selectRatio(selectedBtn) {
      const nextRatio = parseFloat(selectedBtn.dataset.ratio);
      const changed = nextRatio !== currentRatio;
      currentRatio = nextRatio;

      document.querySelectorAll('#ratioGroup1 .ratio-btn, #ratioGroup2 .ratio-btn').forEach(btn => {
        const isMatch = parseFloat(btn.dataset.ratio) === currentRatio;
        btn.classList.toggle('active', isMatch);
        btn.setAttribute('aria-checked', isMatch ? 'true' : 'false');
      });

      const inOutputStage = !document.getElementById('stageOutput').classList.contains('hidden');
      if (changed && inOutputStage) {
        generateSummary();
      }
    }

    function showError(msg) {
      document.getElementById('statsAlert').classList.remove('show');
      document.getElementById('errorText').innerText = msg;
      document.getElementById('errorAlert').classList.add('show');
    }

    function setExpanded(state) {
      isExpanded = state;
      const container = document.getElementById('outputContainer');
      container.classList.toggle('expanded', isExpanded);
      document.getElementById('expandLabel').innerText = isExpanded ? 'بستن' : 'مشاهده بیشتر';
      document.querySelector('#btnExpand svg').innerHTML = isExpanded ? CHEVRON_UP : CHEVRON_DOWN;
      if (!isExpanded) container.scrollTop = 0;
    }

    function toggleOutputHeight() { setExpanded(!isExpanded); }

    function generateSummary() {
      const btn = document.getElementById('btnGenerate');
      const rawText = document.getElementById('inputText').value.trim();
      document.getElementById('errorAlert').classList.remove('show');

      if (!rawText) {
        showError('لطفاً ابتدا متن چت را وارد کنید.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> در حال پردازش...`;

      setTimeout(() => {
        try {
          const wasInOutputStage = !document.getElementById('stageOutput').classList.contains('hidden');

          const junkWords = ['Copy code', 'Regenerate', 'Share', 'Grok', 'Think', 'DeepSearch', 'Attach', 'Send', 'ChatGPT', 'Draft'];
          let rawLines = rawText.split('\n')
            .map(line => normalizePersian(line))
            .filter(line => line.length > 3 && !junkWords.some(junk => line.includes(junk)));

          let chunks = [];
          let inCodeBlock = false;
          let codeBuffer = [];

          for (let line of rawLines) {
            if (line.trim().startsWith('```')) {
              if (inCodeBlock) {
                codeBuffer.push(line);
                chunks.push({ type: 'code', text: codeBuffer.join('\n'), originalIndex: chunks.length });
                codeBuffer = [];
                inCodeBlock = false;
              } else {
                inCodeBlock = true;
                codeBuffer.push(line);
              }
            } else if (inCodeBlock) {
              codeBuffer.push(line);
            } else {
              chunks.push({ type: 'text', text: line, originalIndex: chunks.length });
            }
          }

          const wordFreq = {};
          const docFreq = {};
          const totalDocs = chunks.filter(c => c.type === 'text').length || 1;
          
          const stopWords = new Set([
            'است','هست','این','آن','را','به','از','در','با','برای','که','می','شود','کند',
            'the','is','to','and','of','in','a','for','on','with',
            'سلام','خوبی','ممنون','لطفا','خواهش','بله','خیر','آره','نه','خب','ببین','در واقع','من','تو','ما','شما'
          ]);

          const tokenize = (text) => text.toLowerCase().replace(/[^\w\u0600-\u06FF\s]/g, '').split(/\s+/).filter(w => w.length > 2);

          chunks.forEach(chunk => {
            if (chunk.type === 'text') {
              const words = tokenize(chunk.text);
              const uniqueWords = new Set(words);
              uniqueWords.forEach(w => {
                if (!stopWords.has(w)) {
                  docFreq[w] = (docFreq[w] || 0) + 1;
                }
              });
              words.forEach(w => {
                if (!stopWords.has(w)) wordFreq[w] = (wordFreq[w] || 0) + 1;
              });
            }
          });

          const scoredChunks = chunks.map((chunk, index) => {
            if (chunk.type === 'code') {
              return { ...chunk, score: 100 + (chunk.text.split('\n').length * 2) };
            }

            const words = tokenize(chunk.text);
            let score = 0;
            words.forEach(w => {
              if (wordFreq[w]) {
                const idf = Math.log(totalDocs / (docFreq[w] || 1));
                score += (wordFreq[w] * idf);
              }
            });
            score = score / Math.max(words.length, 1);

            if (/[{}();=<>]|const |let |var |function |def |import |class |=>/.test(chunk.text)) score += 15;
            if (/^[-*•\d+\.]/.test(chunk.text)) score += 8;
            if (chunk.text.includes('؟') || chunk.text.includes('?')) score += 10;
            if (index < 4 || index > chunks.length - 4) score += 12;

            return { ...chunk, score };
          });

          const targetCount = Math.max(4, Math.floor(scoredChunks.length * currentRatio));
          
          const sortedByScore = [...scoredChunks].sort((a, b) => b.score - a.score);
          const selectedChunks = [];

          for (let chunk of sortedByScore) {
            if (selectedChunks.length >= targetCount) break;

            let isRedundant = false;
            if (chunk.type === 'text') {
              for (let selected of selectedChunks) {
                if (selected.type === 'text' && getSimilarity(chunk.text, selected.text) > 0.65) {
                  isRedundant = true;
                  break;
                }
              }
            }
            
            if (!isRedundant) {
              selectedChunks.push(chunk);
            }
          }

          selectedChunks.sort((a, b) => a.originalIndex - b.originalIndex);

          const summaryBody = selectedChunks.map(c => c.text).join('\n');

          fullSummaryPrompt = `من یک گفتگو را خلاصه کرده‌ام. لطفاً این زمینه (Context) را به عنوان حافظه کوتاه‌مدت در نظر بگیر. نکات کلیدی، تصمیمات و کدها حفظ شده‌اند:

--- خلاصه ساختاریافته ---
${summaryBody}
--- پایان خلاصه ---

لطفاً تأیید کن که این زمینه را دریافت کردی و آماده‌ای گفتگو را از همین نقطه ادامه دهیم.`;

          document.getElementById('outputText').innerText = fullSummaryPrompt;

          const reduction = Math.max(0, Math.round((1 - (summaryBody.length / rawText.length)) * 100));
          document.getElementById('statsText').innerText = `حجم متن ${reduction}٪ فشرده‌تر شد (با حفظ کدها و حذف تکرار).`;
          document.getElementById('statsAlert').classList.add('show');
          document.getElementById('copyLabel').innerText = 'کپی نتیجه';

          if (!wasInOutputStage) setExpanded(false);

          document.getElementById('guideText').style.display = 'none';
          document.getElementById('stageInput').classList.add('hidden');
          document.getElementById('stageOutput').classList.remove('hidden');

        } catch (e) {
          showError('خطایی در پردازش متن رخ داد. لطفاً متن را بررسی کنید.');
          console.error(e);
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h6"/></svg> تولید خلاصه ساختاریافته`;
        }
      }, 50);
    }

    function goBack() {
      document.getElementById('stageOutput').classList.add('hidden');
      document.getElementById('stageInput').classList.remove('hidden');
      document.getElementById('guideText').style.display = 'block';
      document.getElementById('statsAlert').classList.remove('show');
      document.getElementById('errorAlert').classList.remove('show');
      document.getElementById('copyLabel').innerText = 'کپی نتیجه';
    }

    function copyResult() {
      if (!fullSummaryPrompt) return;
      const done = () => {
        const label = document.getElementById('copyLabel');
        label.innerText = 'کپی شد!';
        setTimeout(() => { label.innerText = 'کپی نتیجه'; }, 2000);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullSummaryPrompt).then(done).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        const ta = document.createElement('textarea');
        ta.value = fullSummaryPrompt;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { showError('کپی خودکار ممکن نشد؛ متن را دستی انتخاب و کپی کنید.'); }
        document.body.removeChild(ta);
      }
    }
  </script>
  
  <style>
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</body>
</html>
